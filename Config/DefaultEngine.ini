[/Script/Engine.RendererSettings]
; Global illumination is deliberately NOT Lumen (1). Lumen does not run inside
; SceneCapture components, and when it is the GI method the SkyLight's diffuse is
; routed through it - so every capture came back with pure black shadow faces while
; the light itself measured as correctly configured. Method 0 restores the classic
; SkyLight ambient path, which scene captures do honour. It is also cheaper and
; frame-rate independent, which matters more than Lumen's fidelity for a dataset.
r.DynamicGlobalIlluminationMethod=0
; Screen-space, not None: the ambient cubemap is composited in the reflection
; environment pass, so disabling reflections outright also discards the only
; ambient source that reaches a SceneCapture2D.
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0

; Auto-exposure would let identical scenes render at different brightness, which is
; noise a model would have to learn around. Motion blur is off because a real speed
; camera uses a very short exposure to freeze the plate.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False

